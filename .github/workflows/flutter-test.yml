name: Flutter test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4

      - name: Install dependencies
        run: flutter pub get

      # Path filter: unit/widget tests only. integration_test/ needs a
      # device/emulator (demo walkthrough) and is parked out of CI.
      - name: Run unit and widget tests
        run: flutter test test
